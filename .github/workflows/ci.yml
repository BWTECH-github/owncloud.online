name: CI

on:
  # Manuell ausloesbar: waehrend einer GitHub-Actions-Stoerung werden
  # push-Events teilweise gar nicht erst zu Laeufen verarbeitet. Ohne diesen
  # Eintrag bleibt als einziger Ausweg ein kuenstlicher Commit, nur um die
  # Pruefungen erneut anzustossen.
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "changelog/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "changelog/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-git-messages:
    name: Commits
    uses: owncloud/reusable-workflows/.github/workflows/semantic-git-message.yml@ed7b4827feafc644f1fd1b723b7a1ca890480009 # main

  php-unit:
    name: PHP Unit
    uses: ./.github/workflows/php-unit.yml
    with:
      php-versions: '["8.4"]'

  # Alle anderen Jobs installieren frisch. Dieser hier aktualisiert eine
  # bestehende Installation - der einzige Weg, einen kaputten Update-Pfad zu
  # bemerken, bevor er beim Kunden auffaellt.
  upgrade:
    name: Upgrade
    uses: ./.github/workflows/upgrade-test.yml
