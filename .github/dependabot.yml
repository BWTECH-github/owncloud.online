version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    time: "22:00"
  open-pull-requests-limit: 10
  reviewers:
  - phil-davis
  assignees:
  - phil-davis
  groups:
    symfony:
      patterns:
        - "symfony/*"
  ignore:
  - dependency-name: guzzlehttp/guzzle
    versions:
    - "< 7, >= 6.a"
  - dependency-name: league/flysystem
    versions:
    - ">= 2.a"
  # doctrine/dbal 4.x entfernt unter anderem QueryBuilder::execute(), auf das
  # sich lib/private/DB/QueryBuilder (und darueber ~400 Aufrufstellen im
  # Code) stuetzt. Ein Major-Update ist ein eigenes Migrationsprojekt, kein
  # Dependabot-PR - bis dahin nur 3.x-Updates anbieten (PR #75 wurde deshalb
  # geschlossen).
  - dependency-name: doctrine/dbal
    versions:
    - 2.13.0
    - ">= 4.a"
  - dependency-name: symfony/translation
    versions:
    - 4.4.21
  - dependency-name: swiftmailer/swiftmailer
    versions:
    - 6.2.6
  - dependency-name: phpseclib/phpseclib
    versions:
    - 3.0.2
    - 3.0.5
# SEC-19: apps/oco_mcp buendelt einen eigenen composer.lock (mcp/sdk und dessen
# PSR-/Symfony-Abhaengigkeiten). Der wurde von der Wurzel-Konfiguration oben
# NICHT erfasst, das SDK lief also ohne Update-Beobachtung - obwohl es die aus
# dem Netz erreichbare Komponente ist, die JSON-RPC parst. mcp/sdk ist jung und
# in den Advisory-Datenbanken kaum abgedeckt; Updates deshalb zeitnah nachziehen
# und dabei CHANGELOG/SECURITY des SDK durchsehen.
- package-ecosystem: composer
  directory: "/apps/oco_mcp"
  schedule:
    interval: weekly
    time: "22:00"
  open-pull-requests-limit: 5

- package-ecosystem: npm
  directory: "/build"
  schedule:
    interval: weekly
    time: "22:00"
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: jasmine-core
    versions:
    - ">= 3.a, < 4"
  - dependency-name: karma-jasmine
    versions:
    - ">= 2.a, < 3"
  - dependency-name: karma
    versions:
    - 6.0.2
    - 6.0.4
    - 6.1.0
    - 6.1.1
    - 6.2.0
    - 6.3.1
  - dependency-name: y18n
    versions:
    - 4.0.1
  - dependency-name: sinon
    versions:
    - 9.2.4
    - ">= 20.a"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "22:00"
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
