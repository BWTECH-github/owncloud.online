site_name: owncloud.online Dokumentation
# Modified by BW-Tech GmbH
site_description: Betrieb, Installation, Administration und Entwicklung von owncloud.online.
site_url: https://docs.owncloud.online/
repo_url: https://github.com/BWTECH-github/owncloud.online
repo_name: BWTECH-github/owncloud.online
edit_uri: ""

theme:
  name: material
  language: de
  logo: assets/images/owncloud-online-logo.svg
  favicon: assets/images/owncloud-online-logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: cyan

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start: index.md
  - Installation:
      - installation/index.md
      - Linux-Server: installation/linux-server.md
      - Webhosting mit Plesk: installation/webhosting.md
      - Windows mit WSL (zum Testen): installation/local-wsl.md
  - Administration:
      - administration/index.md
      - Benutzer und Gruppen: administration/users-groups.md
      - Freigaben steuern: administration/sharing-policies.md
      - E-Mail-Versand: administration/email.md
      - Hintergrund-Jobs (Cron): administration/background-jobs.md
      - Konfiguration (config.php): administration/config-reference.md
      - occ - die Kommandozeile: administration/occ-reference.md
      - Datenbank: administration/database.md
      - Externe Speicher: administration/external-storage.md
      - Verzeichnisdienst (LDAP): administration/ldap.md
      - Anmeldung über OAuth2 und OpenID Connect: administration/single-sign-on.md
      - Zwei-Faktor-Anmeldung: administration/two-factor.md
      - Verschlüsselung: administration/encryption.md
      - Virenprüfung: administration/antivirus.md
      - Regeln und Aufbewahrung: administration/workflow-retention.md
      - Apps und Marketplace: administration/apps-market.md
      - Reverse-Proxy und TLS: administration/reverse-proxy.md
      - Sicherheit und Setup-Warnungen: administration/security-hardening.md
      - Upstream-CVE-Status: administration/upstream-cve-status.md
      - Performance: administration/performance.md
      - Backups und Updates: administration/backups-updates.md
      - Umzug auf einen anderen Server: administration/migration.md
      - Serverprotokoll und Fehlermeldungen: administration/logging.md
      - Troubleshooting: administration/troubleshooting.md
  - Benutzer:
      - user/index.md
      - Dateien und Freigaben: user/files-sharing.md
      - Desktop Client: user/desktop-client.md
  - Plugins:
      - plugins/index.md
      - Sicherheit und Anmeldung:
          - plugins/apps/twofactor_totp.md
          - plugins/apps/password_policy.md
          - plugins/apps/brute_force_protection.md
          - plugins/apps/oauth2.md
          - plugins/apps/openidconnect.md
          - plugins/apps/user_shibboleth.md
          - plugins/apps/user_ldap.md
          - plugins/apps/impersonate.md
      - Daten schützen:
          - plugins/apps/encryption.md
          - plugins/apps/files_antivirus.md
          - plugins/apps/file_firewall.md
          - plugins/apps/audit_log.md
      - Dateien und Speicher:
          - plugins/apps/wnd.md
          - plugins/apps/files_external_s3.md
          - plugins/apps/files_primary_s3.md
          - plugins/apps/oco_expire.md
          - plugins/apps/workflow.md
          - plugins/apps/files_texteditor.md
          - plugins/apps/files_pdfviewer.md
          - plugins/apps/files_mediaviewer.md
          - plugins/apps/gallery.md
      - Zusammenarbeit und Office:
          - plugins/apps/oco_office.md
          - plugins/apps/onlyoffice.md
          - plugins/apps/richdocuments.md
          - plugins/apps/calendar.md
          - plugins/apps/bwtalk.md
          - plugins/apps/guests.md
          - plugins/apps/customgroups.md
          - plugins/apps/schwarzes_brett.md
      - Verwaltung und Werkzeuge:
          - plugins/apps/market.md
          - plugins/apps/configreport.md
          - plugins/apps/theme-owncloudonline.md
          - plugins/apps/firstrunwizard.md
          - plugins/apps/announcementcenter.md
          - plugins/apps/activity.md
          - plugins/apps/notifications.md
          - plugins/apps/ai_documents.md
          - plugins/apps/oco_mcp.md
      - MCP Connector (KI-Anbindung): plugins/mcp-connector.md
  - Entwickler:
      - developer/index.md
      - Release Workflow: developer/release-workflow.md
      - PHP 8.4 Kompatibilität: developer/php84-compat.md

