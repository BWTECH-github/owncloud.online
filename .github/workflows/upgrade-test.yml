name: Upgrade

# Prueft, was die uebrigen Jobs nicht pruefen: dass eine BESTEHENDE Installation
# auf diesen Stand aktualisiert werden kann. Alle anderen Jobs installieren
# frisch - deshalb war v11.0.12 vollstaendig gruen, obwohl `occ upgrade` von
# 11.0.11 aus mit NeedsUpdateException abbrach, sobald eine Theme-App ihre
# Version aenderte.
#
# Zwei Teile:
#   A  echtes Update vom letzten Release-Tag auf diesen Stand
#   B  gezielt die Fehlerklasse: eine App vom Typ theme mit Versionssprung

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade from previous release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout owncloud.online
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Vollstaendige Historie: der vorherige Release-Tag wird gebraucht.
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: curl, gd, json, xml, zip, sqlite3, pdo_sqlite
          ini-values: "memory_limit=2048M"
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer
          key: upgrade-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            upgrade-composer-${{ runner.os }}-

      - name: Determine previous release tag
        id: vorher
        run: |
          set -euo pipefail
          # Nur unsere eigenen Release-Tags: streng vMAJOR.MINOR.PATCH. Ohne
          # diesen Filter greift die Historie die geerbten Upstream-Tags mit ab
          # (vv9.1.4RC1 und aehnliche), und `--sort=-v:refname` sortiert die
          # wegen des doppelten v sogar nach vorne - der Test wuerde dann von
          # ownCloud 9 aus aktualisieren.
          eigene() { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; }
          aktuell="$(git tag --points-at HEAD | eigene | head -1 || true)"
          vorher=""
          for t in $(git tag --list 'v*' | eigene | sort -V -r); do
            if [ "$t" != "$aktuell" ]; then vorher="$t"; break; fi
          done
          if [ -z "$vorher" ]; then
            echo "Kein vorheriger Release-Tag gefunden - Teil A wird uebersprungen."
          else
            echo "Vorversion: $vorher"
          fi
          echo "tag=${vorher}" >> "$GITHUB_OUTPUT"

      - name: Install the previous release
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/alt" "${{ steps.vorher.outputs.tag }}"
          cd "$RUNNER_TEMP/alt"
          composer install --no-interaction --no-dev --no-progress
          php occ maintenance:install \
            --database sqlite \
            --admin-user admin \
            --admin-pass 'CiUpgrade!2026' \
            --data-dir "$RUNNER_TEMP/data"
          echo "Installierte Version:"
          php occ config:system:get version

      # Genau der Fall, der uns getroffen hat: eine App vom Typ theme, die beim
      # Update ihre Version wechselt. OC::init() laedt solche Apps ganz frueh;
      # loadApp() wirft dann NeedsUpdateException, und die faengt im Bootstrap
      # niemand - occ stirbt, bevor es das Upgrade ausfuehren kann.
      #
      # ownCloud laesst immer nur ein Theme zu ("... can't be enabled until ...
      # is disabled"). Wo schon eines aktiv ist - im Bundle
      # theme-owncloudonline - wird genau dieses genommen; naeher am echten
      # Vorfall geht es nicht. Sonst eine Attrappe.
      - name: Pick the theme app whose version will change
        id: theme
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe-info.xml" <<'XML'
          <?xml version="1.0"?>
          <info>
            <id>ci_upgrade_probe</id>
            <name>CI upgrade probe</name>
            <description>Only exists during the upgrade job.</description>
            <licence>AGPL</licence>
            <author>BW-Tech GmbH</author>
            <version>1.0.0</version>
            <types>
              <theme/>
            </types>
            <dependencies>
              <owncloud min-version="10" max-version="11" />
            </dependencies>
          </info>
          XML
          cd "$RUNNER_TEMP/alt"
          gefunden=""
          for xml in apps/*/appinfo/info.xml apps-external/*/appinfo/info.xml; do
            [ -f "$xml" ] || continue
            grep -qE '<theme[[:space:]]*/>' "$xml" || continue
            id="$(basename "$(dirname "$(dirname "$xml")")")"
            [ "$(php occ config:app:get "$id" enabled 2>/dev/null || true)" = "yes" ] || continue
            gefunden="$id"
            echo "Aktives Theme gefunden: $id"
            break
          done
          if [ -z "$gefunden" ]; then
            gefunden=ci_upgrade_probe
            mkdir -p "apps/$gefunden/appinfo"
            cp "$RUNNER_TEMP/probe-info.xml" "apps/$gefunden/appinfo/info.xml"
            # app.php muss existieren: nur dann prueft loadApp() ueberhaupt auf
            # einen ausstehenden Upgrade.
            printf '<?php\n' > "apps/$gefunden/appinfo/app.php"
            php occ app:enable "$gefunden"
            echo "Kein Theme aktiv - Attrappe angelegt."
          fi
          stand="$(php occ config:app:get "$gefunden" installed_version)"
          echo "Theme-App: $gefunden, steht auf $stand"
          echo "app=$gefunden" >> "$GITHUB_OUTPUT"
          echo "vorher=$stand" >> "$GITHUB_OUTPUT"

      - name: Swap in the current code
        id: tausch
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          # Wie ein echtes Deployment: Code tauschen, config und data behalten.
          #
          # Was NICHT mitgetauscht werden darf, weil die Quelle es gar nicht
          # kennt und --delete es sonst wegraeumt:
          #   lib/composer          nicht versioniert; ein echtes Deployment
          #                         laesst es stehen und ruft composer install.
          #   apps/ci_upgrade_probe die eben angelegte Probe-App - genau die,
          #                         deren Versionssprung geprueft werden soll.
          # --force fuer die uebrigen Verzeichnisse, die beim Sprung ueber
          # mehrere Versionen wegfallen und noch Inhalt haben.
          rsync -a --delete --force \
            --exclude 'config/config.php' \
            --exclude 'data' \
            --exclude '.git' \
            --exclude '/lib/composer' \
            --exclude '/apps/ci_upgrade_probe' \
            "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/alt/"
          cd "$RUNNER_TEMP/alt"
          # Der Autoloader MUSS neu erzeugt werden - lib/composer ist nicht
          # versioniert, und eine alte Classmap zeigt sonst auf geloeschte
          # Klassen (500 auf jeder Seite).
          composer install --no-interaction --no-dev --no-progress
          # Die Theme-App bekommt einen Major-Sprung. Patch-Spruenge wuerden
          # nicht reichen: OC_App::shouldUpgrade() schreibt die still durch.
          app="${{ steps.theme.outputs.app }}"
          vorher="${{ steps.theme.outputs.vorher }}"
          neu="$(( ${vorher%%.*} + 1 )).0.0"
          pfad="$(ls -d "apps/$app" "apps-external/$app" 2>/dev/null | head -1)"
          # Nur das erste <version>-Element: weiter unten stehen teils
          # Abhaengigkeiten mit eigenen Versionsangaben.
          sed -i "0,/<version>[^<]*<\/version>/s//<version>$neu<\/version>/" \
            "$pfad/appinfo/info.xml"
          echo "$app: $vorher -> $(grep -o '<version>[^<]*</version>' "$pfad/appinfo/info.xml" | head -1)"
          echo "neu=$neu" >> "$GITHUB_OUTPUT"

      - name: occ upgrade must succeed
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alt"
          # Bewusst OHNE vorher maintenance zu setzen: genau so faehrt es das
          # Provisioning, und genau so ist der Fehler aufgetreten.
          php occ upgrade --no-interaction

      - name: Verify the instance afterwards
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alt"

          erwartet="$(php -r 'require "version.php"; echo implode(".", $OC_Version);')"
          tatsaechlich="$(php occ config:system:get version)"
          echo "Version erwartet: $erwartet / in der Datenbank: $tatsaechlich"
          [ "$erwartet" = "$tatsaechlich" ] || { echo "Versionsstand stimmt nicht"; exit 1; }

          app="${{ steps.theme.outputs.app }}"
          neu="${{ steps.tausch.outputs.neu }}"
          stand="$(php occ config:app:get "$app" installed_version)"
          echo "Theme-App $app: $stand (erwartet $neu)"
          [ "$stand" = "$neu" ] || { echo "App-Upgrade nicht angekommen"; exit 1; }

          wartung="$(php occ config:system:get maintenance || echo false)"
          echo "Wartungsmodus danach: $wartung"
          [ "$wartung" != "true" ] || { echo "Wartungsmodus blieb an"; exit 1; }

          # occ muss weiterhin bedienbar sein
          php occ status
          php occ app:list > /dev/null

      - name: The web interface must answer
        if: steps.vorher.outputs.tag != ''
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alt"
          php -S 127.0.0.1:8099 -t . > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/status.php || true)"
            [ "$code" = "200" ] && break
          done
          echo "status.php: $code"
          [ "$code" = "200" ] || { echo "status.php antwortet nicht"; cat "$RUNNER_TEMP/web.log"; exit 1; }

          login="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/index.php/login)"
          echo "Login-Seite: $login"
          [ "$login" = "200" ] || { echo "Login-Seite antwortet $login"; exit 1; }

          fatale="$(grep -ciE 'Uncaught|PHP Fatal' "$RUNNER_TEMP/web.log" || true)"
          echo "fatale PHP-Fehler: $fatale"
          [ "$fatale" = "0" ] || { grep -iE 'Uncaught|PHP Fatal' "$RUNNER_TEMP/web.log" | head -5; exit 1; }

      - name: Server log
        if: always() && steps.vorher.outputs.tag != ''
        run: |
          if [ -f "$RUNNER_TEMP/data/owncloud.log" ]; then
            echo "--- letzte 40 Zeilen ---"
            tail -40 "$RUNNER_TEMP/data/owncloud.log"
          else
            echo "kein owncloud.log"
          fi
