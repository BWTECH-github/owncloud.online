# Modified by BW-Tech GmbH: clean release workflow for owncloud.online core only.
name: owncloud.online Clean Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 11.0.1. Empty = version.php"
        required: false
        type: string
      create_github_release:
        description: "Create a GitHub Release with the generated files"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write       # SEC-09: OIDC token for build-provenance attestation
  attestations: write   # SEC-09: write Sigstore build-provenance attestations

env:
  RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
  CREATE_GITHUB_RELEASE: ${{ github.event.inputs.create_github_release || 'false' }}

jobs:
  build-release:
    name: Build clean owncloud.online release packages
    runs-on: ubuntu-latest
    # Ohne Grenze gälte die Vorgabe von 360 Minuten, und eine hängende
    # Verbindung kostete sechs Stunden. 60 und nicht 30: die Grenze muss das
    # Wiederholungsbudget des Composer-Schritts fassen (fünf Anläufe mit
    # 30+60+90+120 s Pause, icewind/* per git clone von codeberg.org).
    timeout-minutes: 60
    # Zwei Läufe für dieselbe Version laufen nacheinander, nicht gleichzeitig;
    # sonst überschriebe das zweite Release das erste still.
    concurrency:
      group: release-build-${{ github.event.inputs.version || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout owncloud.online
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: apcu, ctype, curl, dom, exif, fileinfo, gd, iconv, imagick, intl, json, libxml, mbstring, memcached, openssl, pdo, pdo_mysql, pdo_sqlite, posix, simplexml, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Läuft nach dem Tag: eine einzelne Netzstörung darf hier kein Release
      # verhindern, deshalb Wiederholungen wie beim Composer-Schritt.
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          nochmal() {
            local versuch
            for versuch in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              [ "$versuch" = "4" ] && break
              echo "::warning::'$*' fehlgeschlagen (Anlauf ${versuch}), neuer Versuch in $((versuch * 15))s"
              sleep "$((versuch * 15))"
            done
            echo "::error::'$*' nach vier Anläufen fehlgeschlagen."
            return 1
          }

          # Die Werkzeuge liegen im Runner-Bild bereits; apt nur, wenn eines fehlt.
          fehlend=""
          for werkzeug in make rsync tar zip unzip bzip2; do
            command -v "$werkzeug" >/dev/null 2>&1 || fehlend="$fehlend $werkzeug"
          done
          if [ -n "$fehlend" ]; then
            echo "Fehlt im Runner-Bild:$fehlend"
            nochmal sudo apt-get update
            # shellcheck disable=SC2086 # Worttrennung ist hier gewollt
            nochmal sudo apt-get install -y $fehlend
          else
            echo "Alle Werkzeuge im Runner-Bild vorhanden, apt wird nicht gebraucht."
          fi

          # Dieselbe terser-Version wie build/package.json und das Lint-Tor.
          # Weicht sie ab, erzeugt der Release-Build andere Bytes als die
          # eingecheckten .min-Dateien. yarn wird nicht mehr gebraucht, siehe
          # "make -o build/node_modules dist-dir".
          nochmal npm install -g terser@5.49.1 clean-css-cli@5.6.3

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION_INPUT:-}"
          version="${version#v}"

          if [[ -z "${version}" || "${version}" == "main" || "${version}" == "master" ]]; then
            version="$(php -r '
              require "version.php";
              if (isset($OC_VersionString) && $OC_VersionString !== "") {
                echo $OC_VersionString;
              } elseif (isset($OC_Version) && is_array($OC_Version)) {
                echo implode(".", $OC_Version);
              } else {
                fwrite(STDERR, "Could not resolve ownCloud version\n");
                exit(1);
              }
            ')"
          fi

          echo "release_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release version: ${version}"

      - name: Regenerate minified assets
        shell: bash
        run: |
          set -euo pipefail
          make minify-assets
          # Fail loudly if .min siblings were stale or missing — the repo copy
          # is what git deployments serve, so it must be regenerated + committed.
          # git status also catches newly generated (untracked) siblings that
          # a plain git diff would miss.
          status="$(git status --porcelain -- '*.min.js' '*.min.css')"
          if [ -n "${status}" ]; then
            echo "${status}"
            echo "Stale or uncommitted .min siblings detected - run 'make minify-assets' and commit."
            exit 1
          fi

      - name: Build owncloud.online core distribution
        shell: bash
        run: |
          set -euo pipefail
          composer config --global github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

          # Mehrere Anlaeufe, weil zwei Abhaengigkeiten an einem einzelnen
          # fremden Server haengen: icewind/streams und icewind/smb liegen auf
          # codeberg.org, und Packagist stellt fuer Codeberg-Projekte kein
          # Fertigpaket bereit (icewind/smb: 0 von 48 Fassungen, icewind/streams:
          # ausgerechnet die genutzte v0.7.8 nicht). composer.json holt sie
          # deshalb per "preferred-install: source" direkt als git clone.
          # Am 10.09.2026 hat eine Codeberg-Stoerung (504/502/Zeitueberschreitung)
          # drei Release-Bauten hintereinander abgebrochen, obwohl am Stand
          # nichts fehlte. Der Composer-Cache haelt bereits Geholtes fest, jeder
          # Anlauf kommt also weiter. Fuenf Versuche mit wachsender Pause.
          #
          # Die Abhaengigkeiten werden hier ZUERST und getrennt geholt, nicht
          # innerhalb von "make dist-dir". Grund: das Makefile fuehrt lib/composer
          # als Verzeichnis-Ziel. Bricht "composer install" ab, bleibt das
          # Verzeichnis mit halben Downloads (tmp-*.zip) zurueck und ist juenger
          # als composer.json - der naechste make-Anlauf haelt die Abhaengigkeit
          # damit faelschlich fuer erfuellt, ueberspringt composer und packt die
          # Reste ins Release. Genau so entstand das kaputte 11.0.18-Archiv:
          # lib/composer enthielt 26 tmp-*.zip und kein autoload.php.
          # Deshalb vor jedem Anlauf den halben Stand wegraeumen; der
          # Composer-Cache unter ~/.cache/composer bleibt davon unberuehrt, jeder
          # Anlauf kommt also trotzdem weiter.
          for versuch in 1 2 3 4 5; do
            rm -rf lib/composer
            if composer install --no-dev --no-interaction --no-progress; then
              break
            fi
            if [ "$versuch" = "5" ]; then
              echo "::error::Composer-Abhaengigkeiten nach fuenf Anlaeufen nicht vollstaendig - siehe Meldungen oben."
              exit 1
            fi
            pause=$((versuch * 30))
            echo "::warning::Anlauf ${versuch} fehlgeschlagen, neuer Versuch in ${pause}s"
            sleep "${pause}"
          done

          # Harte Schranke: ohne diese beiden Dateien ist das Archiv unbrauchbar,
          # und der Fehler faellt erst beim Kunden beim Entpacken auf.
          test -f lib/composer/autoload.php
          test -f lib/composer/composer/installed.json

          # -o build/node_modules: "als erfüllt behandeln, nicht neu bauen".
          # core/vendor hängt im Makefile an build/node_modules, also zog
          # "make dist-dir" bisher verdeckt ein vollständiges "yarn install"
          # nach (278 Pakete, 20 direkt von github.com, ohne Wiederholung).
          # Für das Paket bewirkt das nichts: core/vendor ist eingecheckt und
          # wird aus dem Repository kopiert, build/ gehört nicht zum Paket.
          make -o build/node_modules dist-dir RELEASE_CHANNEL=bwtech

          test -d build/dist/owncloud
          test -f build/dist/owncloud/lib/composer/autoload.php
          test -f build/dist/owncloud/lib/composer/composer/installed.json
          if find build/dist/owncloud/lib/composer -name 'tmp-*.zip' -print -quit | grep -q .; then
            echo "::error::Abgebrochene Composer-Downloads (tmp-*.zip) im Release-Baum."
            exit 1
          fi

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.release_version }}"
          artifact_dir="${GITHUB_WORKSPACE}/build/release-artifacts"
          release_stage="${GITHUB_WORKSPACE}/build/release/owncloud-online"

          rm -rf "${release_stage}" "${artifact_dir}"
          mkdir -p "${release_stage}" "${artifact_dir}"

          rsync -a build/dist/owncloud/ "${release_stage}/owncloud/"

          prune_report="${artifact_dir}/removed-release-files.txt"
          : > "${prune_report}"

          (
            cd "${release_stage}/owncloud"

            for path in README.md CHANGELOG.md; do
              if [[ -e "${path}" ]]; then
                echo "${path}" >> "${prune_report}"
                rm -f "${path}"
              fi
            done

            find . -type f \( \
              -name ".gitattributes" -o \
              -name ".gitignore" -o \
              -name ".gitkeep" -o \
              -name ".php-cs-fixer.php" -o \
              -name ".scrutinizer.yml" -o \
              -name ".travis.yml" -o \
              -name "phpcs.xml" -o \
              -name "phpstan.neon" -o \
              -name "phpunit.xml" -o \
              -name "psalm.xml" -o \
              -name "sonar-project.properties" -o \
              -name "package-lock.json" -o \
              -name "yarn.lock" -o \
              -name "npm-debug.log" -o \
              -name "yarn-error.log" \
              \) -print -delete >> "${prune_report}"

            find . -depth -type d \( \
              -name ".github" -o \
              -name ".idea" -o \
              -name ".scannerwork" -o \
              -name ".vscode" -o \
              -name "coverage" -o \
              -name "node_modules" -o \
              -name "test" -o \
              -name "tests" -o \
              -name "vendor-bin" \
              \) -print -exec rm -rf {} + >> "${prune_report}"
          )

          # "commit" ist das tatsächlich gebaute Commit, als eigene Zuweisung
          # VOR dem Heredoc: der Exit-Code einer Befehlsersetzung im Heredoc
          # zählt nicht, ein Fehlschlag von git ergäbe dort still "commit": "".
          gebaut="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          test -n "${gebaut}"
          cat > "${artifact_dir}/release-manifest.json" <<EOF
          {
            "product": "owncloud.online",
            "version": "${version}",
            "commit": "${gebaut}",
            "php": "$(php -r 'echo PHP_VERSION;')",
            "bundle": {
              "name": "owncloud-online",
              "description": "clean owncloud.online core release",
              "apps": []
            },
            "excludedCustomApps": true,
            "notes": [
              "No custom app packages are bundled.",
              "Only core ownCloud apps required by the distribution remain part of this release.",
              "Development, CI, test, cache and package-manager metadata files are pruned after the core distribution build."
            ]
          }
          EOF

          (
            cd "${release_stage}"
            zip -rq "${artifact_dir}/owncloud-online-${version}.zip" owncloud
            tar -czf "${artifact_dir}/owncloud-online-${version}.tar.gz" owncloud
          )

          (
            cd "${artifact_dir}"
            sha256sum *.tar.gz *.zip *.json > SHA256SUMS.txt
          )

      # SEC-09: CycloneDX SBOM of the shipped bundle. continue-on-error until the
      # first real release run is verified, then drop it to enforce.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        continue-on-error: true
        with:
          path: build/release/owncloud-online/owncloud
          format: cyclonedx-json
          output-file: build/release-artifacts/sbom-owncloud-online-${{ steps.version.outputs.release_version }}.cdx.json
          upload-artifact: false

      - name: Add SBOM to checksums
        if: hashFiles('build/release-artifacts/sbom-*.cdx.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd build/release-artifacts
          sha256sum sbom-*.cdx.json >> SHA256SUMS.txt

      # Nur wenn KEIN Release entsteht. Entsteht eines, tragen dessen Assets
      # dieselben Dateien - der Artefaktspeicher waere eine zweite Kopie, die
      # allein das Kontingent fuellt. Genau das ist am 22.09.2026 passiert:
      # "Failed to CreateArtifact: Artifact storage quota has been hit", und
      # weil der Schritt den Job beendete, wurden Attestierung UND Release
      # uebersprungen. Der Tag v11.0.27 stand danach ohne Release da.
      #
      # Deshalb zusaetzlich continue-on-error: das Paket ist das Ergebnis, der
      # Artefaktspeicher nur eine Bequemlichkeit. Ein volles Kontingent darf
      # die Auslieferung nie wieder aufhalten.
      #
      # retention-days: 7 statt der voreingestellten 90 - fuer eine naechtlich
      # gebaute Vorabversion reicht eine Woche, und ohne Grenze fuellt sich der
      # Speicher zwangslaeufig wieder.
      - name: Upload release artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || env.CREATE_GITHUB_RELEASE == 'true') }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owncloud-online-${{ steps.version.outputs.release_version }}
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 7

      # SEC-09: signed build-provenance attestation (Sigstore, keyless via OIDC).
      # Verifiable with: gh attestation verify <artifact> --repo BWTECH-github/owncloud.online
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        continue-on-error: true
        with:
          subject-path: |
            build/release-artifacts/*.tar.gz
            build/release-artifacts/*.zip
            build/release-artifacts/*.cdx.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || env.CREATE_GITHUB_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.release_version) }}
          name: owncloud.online ${{ steps.version.outputs.release_version }}
          files: build/release-artifacts/*
          generate_release_notes: true
